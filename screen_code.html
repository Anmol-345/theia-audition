<!-- BEGIN: Interactive Feedback Script -->
<script data-purpose="button-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      // Add active state toggling for the circular interest options
      const interestPills = document.querySelectorAll('[data-purpose="interest-selection-panel"] button');
      
      interestPills.forEach(pill => {
        pill.addEventListener('click', () => {
          interestPills.forEach(p => {
            p.classList.remove('ring-2', 'ring-white', 'bg-white/40');
          });
          pill.classList.add('ring-2', 'ring-white', 'bg-white/40');
        });
      });
    });
  </script>
